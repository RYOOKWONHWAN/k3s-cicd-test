# k3s 에 기본으로 들어 있는 Traefik 이 http://cicd.localhost 로 들어온 접속을 앱으로 보낸다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cicd-test-app
spec:
  ingressClassName: traefik
  rules:
    - host: cicd.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cicd-test-app
                port:
                  number: 80
