apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-test-app
  strategy:
    # 새 파드가 준비된 뒤에 옛 파드를 끈다 (무중단 배포)
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cicd-test-app
    spec:
      containers:
        - name: app
          # 실제 이미지 주소와 태그는 kustomization.yaml 의 images 에서 바뀐다 (CI 가 고침)
          image: cicd-test-app
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
