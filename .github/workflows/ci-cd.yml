# CI : 문법 검사 → 빌드 → 서버 실행 확인
# CD : 이미지를 만들어 GHCR 에 올리고, k8s/kustomization.yaml 의 태그를 고쳐 커밋한다
#      → WSL 의 Argo CD 가 그 커밋을 보고 k3s 에 배포한다
name: ci-cd

on:
  push:
    branches: [main]
    # CD 가 올린 태그 변경 커밋(k8s 폴더)과 문서 변경으로는 다시 돌지 않게 한다
    paths-ignore:
      - 'k8s/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

# 배포가 겹치면 앞의 것을 취소한다
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 문법 검사
        run: npm run check

      - name: 빌드
        run: npm run build

      - name: 서버 실행 확인
        run: |
          node server.js &
          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 1
          done
          echo "서버가 응답하지 않아요" && exit 1

  cd:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 태그 변경 커밋을 push 하려고
      packages: write   # GHCR 에 이미지를 올리려고
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름 · 태그 정하기
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 · 올리기
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 태그 커밋 (Argo CD 가 이걸 보고 배포)
        run: |
          sed -i "s|^\(\s*newName:\).*|\1 ${IMAGE}|; s|^\(\s*newTag:\).*|\1 ${TAG}|" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet && echo "바뀐 게 없어요" && exit 0
          git commit -m "deploy: ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
